name: Go CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: bash scripts/test-release-assets.sh
      - run: bash scripts/test-check-v2-release.sh
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: darwin, arch: arm64, name: xstash-darwin-arm64 }
          - { os: darwin, arch: amd64, name: xstash-darwin-amd64 }
          - { os: linux, arch: amd64, name: xstash-linux-amd64 }
          - { os: windows, arch: amd64, name: xstash-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o "${{ matrix.target.name }}" ./cmd/xstash
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: ${{ matrix.target.name }}
